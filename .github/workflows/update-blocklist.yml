name: Update blocklist

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-blocklist
  cancel-in-progress: false

jobs:
  update-blocklist:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Generate blocklist
        run: npm run compile

      - name: Publish latest blocklist release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view blocklist >/dev/null 2>&1; then
            gh release create blocklist \
              --title "Latest GeorList blocklist" \
              --notes "Generated automatically by the scheduled update workflow." \
              --latest
          fi

          gh release upload blocklist adguard-blocklist.txt --clobber